<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CHINH PHỤC ĐỈNH CAO - MATH HERO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; margin: 0; padding: 0; }
        body { 
            background-color: #0b0f19; 
            color: #ffffff; 
            padding: 10px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            overflow-x: hidden;
        }
        
        /* HIỆU ỨNG VIỀN NĂNG LƯỢNG ĐỘNG VIÊN — nhẹ nhàng, mang cảm giác "được tiếp sức" hơn là báo động */
        .danger-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 30px rgba(241, 196, 15, 0.35);
            pointer-events: none; z-index: 9999;
            animation: pulseDanger 3.5s infinite alternate;
        }
        @keyframes pulseDanger {
            0% { box-shadow: inset 0 0 12px rgba(241, 196, 15, 0.2); opacity: 0.6; }
            100% { box-shadow: inset 0 0 30px rgba(241, 196, 15, 0.45); opacity: 0.9; }
        }

        /* Hiệu ứng nhắc nhẹ khi chọn sai — không còn "rung lắc" gây giật mình, chỉ nhấp nháy viền mềm */
        @keyframes nudgeScreen {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.06); }
        }

        .container { width: 100%; max-width: 900px; margin: 0 auto; text-align: center; z-index: 10; padding: 0 4px; }

        /* TOP BAR */
        .header-box-boss { 
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            width: 100%; 
            margin-bottom: 12px; 
        }
        .btn-home-boss { 
            background-color: #34495e; 
            color: white; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 0.85rem; 
            transition: 0.2s; 
        }
        .btn-home-boss:hover { background-color: #415b76; }
        .btn-home-boss i { font-size: 1rem; }

        /* CHẶNG LEO NÚI CARD */
        .boss-card {
            background: linear-gradient(135deg, #101a2b 0%, #0d1420 100%);
            border: 2px solid #3498db; 
            border-radius: 16px; 
            padding: 18px 16px; 
            margin-bottom: 20px; 
            position: relative; 
            overflow: hidden;
            box-shadow: 0 0 25px rgba(52, 152, 219, 0.3);
        }
        
        .boss-flex-layout { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 12px; 
            flex-wrap: wrap; 
        }
        
        .boss-avatar-box {
            width: 72px; 
            height: 72px; 
            background-color: #0d1420; 
            border: 3px solid #f1c40f; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 3rem;
            animation: shakeBoss 3s infinite ease-in-out; 
            box-shadow: 0 0 15px #3498db;
            flex-shrink: 0;
        }
        @keyframes shakeBoss {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.04); }
        }

        .boss-info-center {
            flex: 1; 
            text-align: left; 
            min-width: 140px;
            display: flex; 
            flex-direction: column; 
            gap: 4px;
        }
        .boss-name {
            font-family: 'Montserrat', sans-serif; 
            font-weight: 900; 
            font-size: 1.1rem;
            color: #3498db; 
            letter-spacing: 0.5px; 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(52,152,219,0.6); 
            margin: 0;
        }
        .hp-container {
            background-color: #111625; 
            border: 2px solid #34495e; 
            border-radius: 10px;
            height: 22px; 
            width: 100%; 
            position: relative; 
            overflow: hidden;
            margin-top: 2px;
        }
        .hp-bar-fill {
            height: 100%; 
            transition: width 0.4s ease-out;
            border-radius: 8px;
        }
        .hp-bar-fill.boss-hp { background: linear-gradient(90deg, #2980b9, #3498db); }
        .hp-bar-fill.player-hp { background: linear-gradient(90deg, #27ae60, #2ecc71); }

        .hp-text {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            font-weight: bold; 
            font-size: 0.7rem; 
            text-shadow: 1px 1px 3px black;
            font-family: 'Montserrat', sans-serif; 
            white-space: nowrap;
        }
        .hp-label {
            font-size: 0.6rem; 
            font-weight: 700; 
            color: #95a5a6;
            text-transform: uppercase; 
            letter-spacing: 0.3px;
            display: flex; 
            justify-content: space-between;
        }
        .hp-label .boss-label { color: #3498db; }
        .hp-label .player-label { color: #2ecc71; }

        /* PLAYER AVATAR */
        .player-avatar-box {
            display: flex; 
            align-items: center; 
            gap: 8px;
            margin-top: 8px; 
            padding-top: 8px; 
            border-top: 1px solid rgba(255,255,255,0.05);
            justify-content: center;
            flex-wrap: wrap;
        }
        .player-avatar {
            width: 48px; 
            height: 48px; 
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #2d4a3d, #0f1f17);
            border: 2px solid #2ecc71;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 1.8rem; 
            box-shadow: 0 0 15px rgba(46,204,113,0.3);
            flex-shrink: 0;
        }
        .player-name-tag {
            font-size: 0.85rem; 
            font-weight: 700; 
            color: #2ecc71;
            font-family: 'Montserrat', sans-serif;
        }

        /* THẺ ĐẶC QUYỀN */
        .boss-card-bar {
            display: flex; 
            gap: 5px; 
            justify-content: center; 
            flex-wrap: wrap;
            margin-top: 12px; 
            padding-top: 10px;
            border-top: 1px solid rgba(241,196,15,0.2);
        }
        .boss-card-bar-label {
            width: 100%; 
            text-align: center; 
            font-size: 0.65rem; 
            font-weight: 700;
            color: rgba(241,196,15,0.7); 
            text-transform: uppercase; 
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .bthe-slot {
            width: 70px; 
            min-height: 62px; 
            border-radius: 9px; 
            border: 2px solid rgba(241,196,15,0.25);
            background: rgba(15,20,35,0.85); 
            text-align: center; 
            padding: 4px 3px;
            cursor: pointer; 
            transition: all 0.22s; 
            user-select: none;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 1px;
            flex: 0 0 auto;
            touch-action: manipulation;
        }
        .bthe-slot:hover:not(.bthe-locked):not(:disabled) {
            border-color: rgba(241,196,15,0.7); 
            background: rgba(241,196,15,0.08);
            transform: translateY(-2px); 
            box-shadow: 0 5px 14px rgba(241,196,15,0.22);
        }
        .bthe-slot.bthe-locked {
            opacity: 0.35; 
            cursor: not-allowed; 
            pointer-events: none;
        }
        .bthe-slot.bthe-activating {
            border-color: #f1c40f !important; 
            box-shadow: 0 0 18px rgba(241,196,15,0.7) !important;
            animation: cardActivate 0.35s ease-out;
        }
        @keyframes cardActivate {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.1); box-shadow: 0 0 28px rgba(241,196,15,0.9); }
            100% { transform: scale(1); }
        }
        .bthe-slot:disabled, .bthe-slot[disabled] {
            opacity: 0.5; 
            cursor: not-allowed; 
            background: rgba(30,30,30,0.6);
            border-color: rgba(100,100,100,0.3); 
            pointer-events: none;
        }
        .bthe-icon  { font-size: 1.3rem; line-height: 1; }
        .bthe-name  { font-size: 0.5rem; font-weight: 700; color: #f1c40f; line-height: 1.15; }
        .bthe-used  { font-size: 0.45rem; color: #64748b; font-weight: 600; margin-top: 1px; }
        .bthe-note  { font-size: 0.45rem; color: #94a3b8; line-height: 1.1; margin-top: 1px; }

        /* QUIZ AREA */
        .quiz-wrapper {
            background-color: #161c2d; 
            border: 1px solid #2c3a57; 
            border-radius: 12px;
            padding: 20px 16px; 
            text-align: left; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
        }
        .q-title { 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 800; 
            color: #f1c40f; 
            font-size: 0.95rem; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
        }
        .q-text { 
            font-size: 1.1rem; 
            line-height: 1.7; 
            margin-bottom: 8px; 
            word-break: break-word; 
        }
        .q-tip {
            font-size: 0.8rem;
            color: #7fdbca;
            background: rgba(46,204,113,0.08);
            border: 1px dashed rgba(46,204,113,0.35);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
        }
        .q-tip i { color: #f1c40f; flex-shrink: 0; }

        .answers-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        .btn-answer {
            background-color: #0b0f19; 
            border: 2px solid #2c3a57; 
            border-radius: 8px;
            padding: 14px 16px; 
            color: white; 
            text-align: left; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: all 0.2s; 
            display: flex; 
            align-items: flex-start; 
            gap: 10px;
            width: 100%; 
            line-height: 1.5;
            touch-action: manipulation;
        }
        .btn-answer span { flex: 1; min-width: 0; word-break: break-word; }
        .btn-answer:hover:not(:disabled) { background-color: #1f2d44; border-color: #f1c40f; }
        .btn-answer.correct { background-color: #27ae60 !important; border-color: #2ecc71 !important; font-weight: bold; }
        .btn-answer.wrong { background-color: #b9770e !important; border-color: #f39c12 !important; opacity: 0.85; }

        .feedback-box {
            padding: 12px; 
            border-radius: 6px; 
            font-weight: bold; 
            margin-bottom: 20px;
            display: none; 
            font-family: 'Montserrat', sans-serif; 
            text-align: center;
            font-size: 0.9rem;
        }
        .explain-box {
            background-color: #0b0f19; 
            border-left: 5px solid #f1c40f;
            padding: 12px 14px; 
            border-radius: 0 8px 8px 0; 
            margin-bottom: 20px; 
            display: none;
        }
        .explain-box p { 
            margin: 6px 0 0 0; 
            color: #bdc3c7; 
            line-height: 1.5; 
            font-size: 0.9rem; 
        }

        .btn-nav {
            background-color: #e67e22; 
            color: white; 
            border: none;
            padding: 12px 24px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase; 
            font-size: 0.9rem; 
            display: none; 
            margin-left: auto;
            touch-action: manipulation;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }
        .btn-nav:hover { background-color: #d35400; }

        /* VICTORY */
        .victory-wrapper {
            background-color: #1a2236; 
            border: 2px solid #2ecc71; 
            border-radius: 12px;
            padding: 30px 20px; 
            text-align: center; 
            display: none;
            box-shadow: 0 0 20px rgba(46,204,113,0.3);
        }
        .victory-wrapper h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            margin: 10px 0;
        }
        .victory-wrapper p {
            font-size: 1rem;
            line-height: 1.6;
        }
        .victory-wrapper a {
            background-color: #2ecc71; 
            color: black; 
            font-weight: bold; 
            padding: 12px 28px; 
            text-decoration: none; 
            border-radius: 8px; 
            text-transform: uppercase; 
            font-size: 0.9rem; 
            display: inline-block;
            margin-top: 10px;
        }

        /* TOAST */
        #toast-box {
            position: fixed; 
            bottom: 16px; 
            right: 16px; 
            z-index: 2000;
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            max-width: 90vw;
        }
        .toast-item {
            background: #141d30; 
            border-left: 4px solid #2ecc71; 
            color: #fff;
            padding: 10px 16px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.85rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); 
            min-width: 180px;
            animation: fadeInToast 0.3s ease;
            word-break: break-word;
        }
        .toast-item.error { border-left-color: #e74c3c; }
        @keyframes fadeInToast { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }

        /* RESPONSIVE */
        @media (min-width: 640px) {
            body { padding: 20px; }
            .container { padding: 0; }
            .boss-card { padding: 25px; }
            .boss-avatar-box { width: 90px; height: 90px; font-size: 3.8rem; }
            .boss-name { font-size: 1.3rem; }
            .hp-container { height: 24px; }
            .hp-text { font-size: 0.8rem; }
            .hp-label { font-size: 0.65rem; }
            .player-avatar { width: 56px; height: 56px; font-size: 2.2rem; }
            .player-name-tag { font-size: 0.9rem; }
            .bthe-slot { width: 80px; min-height: 72px; padding: 6px 4px; }
            .bthe-icon { font-size: 1.6rem; }
            .bthe-name { font-size: 0.55rem; }
            .quiz-wrapper { padding: 30px; }
            .q-title { font-size: 1.1rem; }
            .q-text { font-size: 1.2rem; }
            .btn-answer { padding: 16px 20px; font-size: 1rem; }
            .btn-nav { padding: 12px 28px; font-size: 0.95rem; width: auto; }
            .victory-wrapper { padding: 40px; }
            .victory-wrapper h1 { font-size: 2rem; }
            .victory-wrapper p { font-size: 1.1rem; }
        }

        @media (max-width: 480px) {
            .boss-flex-layout { justify-content: center; text-align: center; }
            .boss-info-center { text-align: center; min-width: 100%; }
            .boss-avatar-box { width: 64px; height: 64px; font-size: 2.6rem; }
            .boss-name { font-size: 0.95rem; }
            .hp-text { font-size: 0.6rem; }
            .player-avatar-box { margin-top: 6px; padding-top: 6px; }
            .bthe-slot { width: 60px; min-height: 54px; padding: 3px 2px; }
            .bthe-icon { font-size: 1.1rem; }
            .bthe-name { font-size: 0.45rem; }
            .q-text { font-size: 1rem; }
            .btn-answer { padding: 12px 14px; font-size: 0.9rem; gap: 8px; }
            .btn-nav { font-size: 0.8rem; padding: 10px 16px; }
            .victory-wrapper h1 { font-size: 1.3rem; }
        }

        @media (max-width: 360px) {
            .bthe-slot { width: 52px; min-height: 48px; }
            .bthe-icon { font-size: 0.9rem; }
            .bthe-name { font-size: 0.4rem; }
            .boss-avatar-box { width: 56px; height: 56px; font-size: 2.2rem; }
        }

        /* Hỗ trợ màn hình cảm ứng */
        @media (hover: none) {
            .btn-answer:hover:not(:disabled) { background-color: initial; }
            .bthe-slot:hover:not(.bthe-locked):not(:disabled) { transform: none; box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="danger-overlay" id="danger-screen"></div>

    <div class="container">
        <!-- TOP BAR -->
        <div class="header-box-boss">
            <a href="index.html" class="btn-home-boss"><i class="fa-solid fa-circle-chevron-left"></i> Trở về</a>
        </div>

        <!-- CHẶNG LEO NÚI -->
        <div class="boss-card">
            <div class="boss-flex-layout">
                <div class="boss-avatar-box" id="boss-avatar">🏔️</div>
                <div class="boss-info-center">
                    <div class="boss-name"><i class="fa-solid fa-mountain"></i> ĐỈNH TRI THỨC</div>
                    <div class="hp-label">
                        <span class="boss-label"><i class="fa-solid fa-flag-checkered"></i> Còn lại đến đỉnh</span>
                        <span class="player-label"><i class="fa-solid fa-bolt"></i> Sức bền</span>
                    </div>
                    <div class="hp-container">
                        <div class="hp-bar-fill boss-hp" id="boss-hp-bar" style="width:100%"></div>
                        <div class="hp-text" id="boss-hp-text">100 / 100</div>
                    </div>
                    <div class="hp-container" style="margin-top:6px;">
                        <div class="hp-bar-fill player-hp" id="player-hp-bar" style="width:100%"></div>
                        <div class="hp-text" id="player-hp-text">100 / 100</div>
                    </div>
                </div>
                <div class="player-avatar-box" style="flex-shrink:0; flex-direction:column; gap:4px; min-width:60px;">
                    <div class="player-avatar" id="player-avatar">🧗</div>
                    <div class="player-name-tag" id="player-name-tag">Nhà leo núi</div>
                </div>
            </div>

            <!-- DỤNG CỤ HỖ TRỢ -->
            <div class="boss-card-bar" id="boss-card-bar">
                <div class="boss-card-bar-label"><i class="fa-solid fa-wand-magic-sparkles"></i> Dụng Cụ Hỗ Trợ</div>
            </div>
        </div>

        <!-- QUIZ AREA -->
        <div class="quiz-wrapper" id="quiz-area">
            <div class="q-title" id="lbl-question-title">Chặng leo thứ 1</div>
            <div class="q-text" id="lbl-question-text">Đang tải thử thách...</div>
            <div class="q-tip"><i class="fa-solid fa-pencil"></i> Đừng vội chọn — hãy thử giải ra nháp trước, tìm cách của riêng em rồi mới chọn đáp án nhé!</div>

            <div class="answers-grid" id="box-answers-list"></div>

            <div class="feedback-box" id="feedback-banner"></div>

            <div class="explain-box" id="explain-container">
                <strong style="color: #f1c40f;"><i class="fa-solid fa-compass"></i> Cùng phân tích lại cách giải:</strong>
                <p id="explain-text"></p>
            </div>

            <button onclick="chuyenCauTiepTheo()" class="btn-nav" id="next-btn">
                Bước Tiếp <i class="fa-solid fa-person-hiking"></i>
            </button>
        </div>

        <!-- VICTORY -->
        <div class="victory-wrapper" id="victory-area">
            <i class="fa-solid fa-trophy" style="font-size: 3.5rem; color: #f1c40f; margin-bottom: 10px;"></i>
            <h1 id="victory-title">CHINH PHỤC THÀNH CÔNG!</h1>
            <p id="victory-desc" style="margin-bottom: 20px;"></p>
            <a href="index.html"><i class="fa-solid fa-house"></i> Trở về sảnh chính</a>
        </div>
    </div>

    <div id="toast-box"></div>

    <script type="module">
        import { taiDuLieuTuMay, dayDuLieuLenMay, taiCauHinhToanCuc, dayCauHinhToanCuc, ghiNhatKyHoatDong } from "./firebase-sync.js";
        window.__fbTaiDuLieuTuMay = taiDuLieuTuMay;
        window.__fbDayDuLieuLenMay = dayDuLieuLenMay;
        window.__fbTaiCauHinhToanCuc = taiCauHinhToanCuc;
        window.__fbDayCauHinhToanCuc = dayCauHinhToanCuc;
        window.__fbGhiNhatKyHoatDong = ghiNhatKyHoatDong;
    </script>
    <script>
        // ============================================================
        //  HỆ THỐNG ÂM THANH
        // ============================================================
        let audioCtx = null;
        let ambientNode1 = null;
        let ambientNode2 = null;
        let ambientGain = null;

        function batDauNhacNenHoiHop() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                ambientGain = audioCtx.createGain();
                ambientGain.gain.setValueAtTime(0.07, audioCtx.currentTime);

                ambientNode1 = audioCtx.createOscillator();
                ambientNode1.type = 'sine';
                ambientNode1.frequency.setValueAtTime(55, audioCtx.currentTime);

                ambientNode2 = audioCtx.createOscillator();
                ambientNode2.type = 'sawtooth';
                ambientNode2.frequency.setValueAtTime(58, audioCtx.currentTime);

                ambientNode1.connect(ambientGain);
                ambientNode2.connect(ambientGain);
                ambientGain.connect(audioCtx.destination);

                ambientNode1.start(); ambientNode2.start();
            } catch (e) { }
        }

        function dungNhacNenHoiHop() {
            try {
                if (ambientGain) {
                    ambientGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    setTimeout(() => {
                        if (ambientNode1) ambientNode1.stop();
                        if (ambientNode2) ambientNode2.stop();
                    }, 500);
                }
            } catch (e) {}
        }

        function phatAmThanhHanhDong(loai) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (loai === 'danger_alarm') {
                    let osc = audioCtx.createOscillator(); let g = audioCtx.createGain();
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.6);
                    g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.connect(g); g.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
                }
                else if (loai === 'hit_boss') {
                    let osc = audioCtx.createOscillator(); let g = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
                    g.gain.setValueAtTime(0.4, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                    osc.connect(g); g.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.45);
                }
                else if (loai === 'monster_roar') {
                    let roar1 = audioCtx.createOscillator(); let roar2 = audioCtx.createOscillator(); let roar3 = audioCtx.createOscillator();
                    let roarGain = audioCtx.createGain();
                    roar1.type = 'sawtooth'; roar1.frequency.setValueAtTime(82, audioCtx.currentTime); roar1.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1.2);
                    roar2.type = 'square'; roar2.frequency.setValueAtTime(76, audioCtx.currentTime); roar2.frequency.linearRampToValueAtTime(35, audioCtx.currentTime + 1.0);
                    roar3.type = 'sawtooth'; roar3.frequency.setValueAtTime(95, audioCtx.currentTime); roar3.frequency.linearRampToValueAtTime(45, audioCtx.currentTime + 0.8);

                    roarGain.gain.setValueAtTime(0.45, audioCtx.currentTime); roarGain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 0.5); roarGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);

                    roar1.connect(roarGain); roar2.connect(roarGain); roar3.connect(roarGain); roarGain.connect(audioCtx.destination);
                    roar1.start(); roar2.start(); roar3.start();
                    roar1.stop(audioCtx.currentTime + 1.2); roar2.stop(audioCtx.currentTime + 1.2); roar3.stop(audioCtx.currentTime + 1.2);
                }
            } catch (e) {}
        }

        // ============================================================

        //  THẺ ĐẶC QUYỀN

            else if (idThe === 'boss_cuonsachtrithu') {
                an2DapAnSaiNgauNhien();

                phatAmThanhHanhDong('hit_boss');

            else if (idThe === 'boss_donghocat') {

        // ============================================================
        //  PARSER CÂU HỎI
        // ============================================================
        function parseTextKhoiCauHoi(rawText) {
            if (!rawText || typeof rawText !== 'string') return [];
            let ketQua = [];
            let khoi = rawText.split(/(?=Câu\s*\d+\s*:)/i).map(s => s.trim()).filter(s => s);
            khoi.forEach(khoiText => {
                try {
                    let dongArr = khoiText.split('\n').map(d => d.trim()).filter(d => d);
                    if (dongArr.length < 3) return;
                    let cauHoiText = dongArr[0].replace(/^Câu\s*\d+\s*:\s*/i, '').trim();
                    let answers = [];
                    let correct = 0;
                    let explanation = '';
                    dongArr.forEach((dong, idx) => {
                        if (idx === 0) return;
                        let mDapAn = dong.match(/^([A-D])\.\s*(.+)/i);
                        if (mDapAn) answers.push(mDapAn[2].trim());
                        let mDung = dong.match(/^Đáp\s*án\s*:\s*([A-D])/i);
                        if (mDung) correct = 'ABCD'.indexOf(mDung[1].toUpperCase());
                        let mGiaiThich = dong.match(/^Giải\s*thích\s*:\s*(.+)/i);
                        if (mGiaiThich) explanation = mGiaiThich[1].trim();
                    });
                    if (cauHoiText && answers.length >= 2) {
                        ketQua.push({ question: cauHoiText, answers, correct, explanation });
                    }
                } catch(e) {}
            });
            return ketQua;
        }

        function chuanHoaCauHoi(rawArr) {
            if (!Array.isArray(rawArr)) return [];
            let ketQua = [];
            rawArr.forEach(item => {
                if (typeof item === 'string') {
                    let parsed = parseTextKhoiCauHoi(item);
                    ketQua = ketQua.concat(parsed);
                } else if (item && typeof item === 'object' && item.question && Array.isArray(item.answers)) {
                    ketQua.push(item);
                } else if (item && typeof item === 'object' && item.rawText) {
                    let parsed = parseTextKhoiCauHoi(item.rawText);
                    ketQua = ketQua.concat(parsed);
                }
            });
            return ketQua;
        }

        function layNgauNhienNCau(mangCauHoi, soLuong) {
            let banSao = mangCauHoi.slice();
            for (let i = banSao.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [banSao[i], banSao[j]] = [banSao[j], banSao[i]];
            }
            return banSao.slice(0, Math.min(soLuong, banSao.length));
        }

        function renderLatexText(raw) {
            if (!raw) return '';
            let chuanHoa = raw
                .replace(/<br\s*\/?>/gi, '\u0001BR\u0001')
                .replace(/\*\*(.+?)\*\*/g, '\u0002B\u0002$1\u0002/B\u0002');
            let result = '';
            let i = 0;
            while (i < chuanHoa.length) {
                if (chuanHoa[i] === '$') {
                    let j = chuanHoa.indexOf('$', i + 1);
                    if (j !== -1) {
                        result += chuanHoa.slice(i, j + 1);
                        i = j + 1;
                    } else {
                        result += '$';
                        i++;
                    }
                } else {
                    let ch = chuanHoa[i];
                    if (ch === '<') result += '&lt;';
                    else if (ch === '>') result += '&gt;';
                    else if (ch === '&') result += '&amp;';
                    else result += ch;
                    i++;
                }
            }
            result = result
                .split('\u0001BR\u0001').join('<br>')
                .split('\u0002B\u0002').join('<strong>')
                .split('\u0002/B\u0002').join('</strong>');
            return result;
        }

        function renderMathJax(element) {
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([element]).catch(e => {});
            }
        }

        // ============================================================
        //  TẢI CÂU HỎI & BẮT ĐẦU TRẬN
        // ============================================================
        function docNganHangDeBoss() {
            let duLieuNganHang = localStorage.getItem('ngan_hang_de_boss') || "[]";
            let khoDeBoss = JSON.parse(duLieuNganHang);
            let khoiHocSinh = sessionStorage.getItem('hoc_school_student_class') || 'Khối 7';

            let cacBoDePhuHop = khoDeBoss.filter(b => !b.grade || b.grade === 'all' || b.grade === khoiHocSinh);
            let khoCauHoiBoss = [];
            cacBoDePhuHop.forEach(bo => {
                if (Array.isArray(bo.questions)) {
                    let daChuanHoa = chuanHoaCauHoi(bo.questions);
                    khoCauHoiBoss = khoCauHoiBoss.concat(daChuanHoa);
                }
                if (typeof bo.rawText === 'string' && bo.rawText.trim()) {
                    let parsed = parseTextKhoiCauHoi(bo.rawText);
                    khoCauHoiBoss = khoCauHoiBoss.concat(parsed);
                }
            });

            if (khoCauHoiBoss.length === 0) {
                let msgEl = document.getElementById('lbl-question-text');
                msgEl.innerHTML = `<span style="color:#e74c3c;"><i class="fa-solid fa-circle-exclamation"></i> Thầy giáo chưa nạp bộ đề nào dành cho <b>${khoiHocSinh}</b>. Vui lòng quay lại sau!</span>`;
                document.getElementById('quiz-area').style.display = 'block';
                return;
            }

            const SO_CAU_MOI_TRAN = 20;
            danhSachCauHoi = layNgauNhienNCau(khoCauHoiBoss, SO_CAU_MOI_TRAN);
            document.getElementById('quiz-area').style.display = 'block';

            bossHP = HP_MAX;
            playerHP = HP_MAX;
            capNhatHP();

            giapHoMenhConLai = false;
            chiMangSamSetSan = false;
            giamSatThuongNhan = 0;
            daDungBinhMau = false;
            Object.keys(thesDaDung).forEach(k => thesDaDung[k] = false);

            truLuotBoss();

            let ten = layTenHocSinhHienTai();
            if (ten) document.getElementById('player-name-tag').innerText = ten;
            else document.getElementById('player-name-tag').innerText = 'Nhà leo núi';

            renderBossCardBar();
            batDauNhacNenHoiHop();

            indexCauHienTai = 0;
            taiCauHoiHT();
        }

        function taiCauHoiHT() {
            daBamChonChua = false;
            cauTraLoiHienTaiDaSai = false;
            document.getElementById('feedback-banner').style.display = 'none';
            document.getElementById('explain-container').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            let cauHoi = danhSachCauHoi[indexCauHienTai];

            document.getElementById('lbl-question-title').innerText = `🧗 CHẶNG LEO THỨ ${indexCauHienTai + 1} / ${danhSachCauHoi.length}`;

            let lblText = document.getElementById('lbl-question-text');
            lblText.innerHTML = renderLatexText(cauHoi.question);

            let boxAns = document.getElementById('box-answers-list');
            boxAns.innerHTML = "";
            let mangPrefix = ['A', 'B', 'C', 'D'];

            cauHoi.answers.forEach((ans, i) => {
                let btn = document.createElement('button');
                btn.className = 'btn-answer';
                btn.id = 'btn-ans-' + i;
                btn.onclick = () => kiemTraDonDanh(i);
                btn.innerHTML = `<strong style="color:#3498db; flex-shrink:0;">${mangPrefix[i]}.</strong> <span>${renderLatexText(ans)}</span>`;
                boxAns.appendChild(btn);
            });

            renderMathJax(document.getElementById('quiz-area'));
        }

        // ============================================================
        //  XỬ LÝ TRẢ LỜI
        // ============================================================
        function kiemTraDonDanh(indexHocSinhChon) {
            if (daBamChonChua) return;
            daBamChonChua = true;

            let cauHoi = danhSachCauHoi[indexCauHienTai];
            let dapAnDung = parseInt(cauHoi.correct) || 0;

            let cacNut = document.querySelectorAll('.btn-answer');
            cacNut.forEach(nut => nut.disabled = true);
            let banner = document.getElementById('feedback-banner');

            let giatDamage = DAMAGE_BASE;
            let bossGiat = BOSS_DAMAGE_BASE;

            if (giamSatThuongNhan > 0) {
                bossGiat = Math.floor(bossGiat * 0.5);
                giamSatThuongNhan--;
            }

            if (indexHocSinhChon === dapAnDung) {
                cauTraLoiHienTaiDaSai = false;
                soCauDungBoss++;
                if (chiMangSamSetSan) {
                    giatDamage *= 2;
                    chiMangSamSetSan = false;
                }
                bossHP = Math.max(0, bossHP - giatDamage);
                document.getElementById(`btn-ans-${indexHocSinhChon}`).classList.add('correct');

                banner.style.backgroundColor = "rgba(46,204,113,0.2)";
                banner.style.color = "#2ecc71";
                banner.style.border = "1px solid #2ecc71";
                banner.innerHTML = `🏔️ Chính xác! Bạn đã tiến thêm ${giatDamage} bước gần đỉnh hơn!`;
                phatAmThanhHanhDong('hit_boss');
            } else {
                cauTraLoiHienTaiDaSai = true;

                if (giapHoMenhConLai) {
                    giapHoMenhConLai = false;
                    bossGiat = 0;
                    document.getElementById(`btn-ans-${indexHocSinhChon}`).classList.add('wrong');
                    document.getElementById(`btn-ans-${dapAnDung}`).classList.add('correct');
                    banner.style.backgroundColor = "rgba(52,152,219,0.2)";
                    banner.style.color = "#3498db";
                    banner.style.border = "1px solid #3498db";
                    banner.innerHTML = `🪢 DÂY AN TOÀN: Giữ bạn vững vàng! Sức bền không hao.`;
                    cauTraLoiHienTaiDaSai = false;
                } else {
                    soCauSaiBoss++;
                    playerHP = Math.max(0, playerHP - bossGiat);
                    document.getElementById(`btn-ans-${indexHocSinhChon}`).classList.add('wrong');
                    document.getElementById(`btn-ans-${dapAnDung}`).classList.add('correct');
                    banner.style.backgroundColor = "rgba(243,156,18,0.15)";
                    banner.style.color = "#f39c12";
                    banner.style.border = "1px solid #f39c12";
                    banner.innerHTML = `🔍 Chưa đúng rồi, nhưng không sao cả — sai là một bước để hiểu bài hơn! Xem lại cách giải bên dưới rồi thử sức ở câu tiếp theo nhé. (-${bossGiat} sức bền)`;
                    document.body.style.animation = "nudgeScreen 0.4s 1";
                    setTimeout(() => document.body.style.animation = "", 450);
                }
            }

            banner.style.display = 'block';
            capNhatHP();

            let explainEl = document.getElementById('explain-text');
            explainEl.innerHTML = renderLatexText(cauHoi.explanation || "Xem kỹ quy tắc đại số sách Chân trời sáng tạo.");
            document.getElementById('explain-container').style.display = 'block';
            renderMathJax(document.getElementById('explain-container'));

            let nutTiep = document.getElementById('next-btn');
            if (indexCauHienTai === danhSachCauHoi.length - 1 || bossHP <= 0 || playerHP <= 0) {
                nutTiep.innerHTML = `Hoàn Thành Hành Trình <i class="fa-solid fa-flag-checkered"></i>`;
            }
            nutTiep.style.display = 'block';

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise().catch(e => {});
        }

        // ============================================================
        //  CHUYỂN CÂU & KẾT THÚC
        // ============================================================
        function chuyenCauTiepTheo() {
            indexCauHienTai++;
            if (indexCauHienTai < danhSachCauHoi.length && bossHP > 0 && playerHP > 0) {
                taiCauHoiHT();
            } else {
                document.getElementById('danger-screen').style.display = 'none';
                document.getElementById('quiz-area').style.display = 'none';
                document.getElementById('victory-area').style.display = 'block';

                dungNhacNenHoiHop();

                let theTieuDe = document.getElementById('victory-title');
                let theMoTa = document.getElementById('victory-desc');

                if (playerHP > bossHP) {
                    document.getElementById('boss-avatar').innerText = '🚩';
                    theTieuDe.innerText = "CHINH PHỤC THÀNH CÔNG! 🎉";
                    theTieuDe.style.color = "#2ecc71";

                    let tyLe = playerHP / HP_MAX;
                    let expThuong = Math.floor(200 + 300 * tyLe);
                    let diemThuong = Math.floor(50 + 100 * tyLe);

                    let ten = layTenHocSinhHienTai();
                    if (ten) {
                        let currentExp = parseInt(localStorage.getItem('exp_' + ten)) || 0;
                        localStorage.setItem('exp_' + ten, currentExp + expThuong);
                        let currentCoin = parseInt(localStorage.getItem('coin_' + ten)) || 50;
                        localStorage.setItem('coin_' + ten, currentCoin + diemThuong);
                        window.__fbDayDuLieuLenMay(ten);
                        window.__fbGhiNhatKyHoatDong(ten, 'boss', soCauDungBoss, soCauSaiBoss, expThuong);
                        theMoTa.innerHTML = `
                            🏔️ Bạn đã chinh phục đỉnh núi tri thức!<br>
                            💪 Sức bền còn lại: ${Math.round(playerHP)}% → thưởng <b style="color:#f1c40f;">+${expThuong} EXP & +${diemThuong} Điểm</b>!
                        `;
                    } else {
                        theMoTa.innerText = `Chinh phục rực rỡ! Sức bền còn lại ${Math.round(playerHP)}%`;
                    }
                } else {
                    theTieuDe.style.color = "#f39c12";
                    document.getElementById('victory-area').style.borderColor = "#f39c12";
                    document.getElementById('boss-avatar').innerText = '🏕️';
                    theTieuDe.innerText = "CHƯA LÊN ĐẾN ĐỈNH LẦN NÀY! 💪";

                    let tienDoGayDamage = Math.min(1, Math.max(0, (HP_MAX - bossHP) / HP_MAX));
                    let expAnUi = Math.floor(30 + 70 * tienDoGayDamage);
                    let diemAnUi = Math.floor(10 + 30 * tienDoGayDamage);

                    let ten = layTenHocSinhHienTai();
                    if (ten) {
                        let currentExp = parseInt(localStorage.getItem('exp_' + ten)) || 0;
                        localStorage.setItem('exp_' + ten, currentExp + expAnUi);
                        let currentCoin = parseInt(localStorage.getItem('coin_' + ten)) || 50;
                        localStorage.setItem('coin_' + ten, currentCoin + diemAnUi);
                        window.__fbDayDuLieuLenMay(ten);
                        window.__fbGhiNhatKyHoatDong(ten, 'boss', soCauDungBoss, soCauSaiBoss, expAnUi);
                        theMoTa.innerHTML = `
                            🏕️ Đỉnh núi vẫn còn cách ${Math.round(bossHP)} bước, nhưng chặng đường em vừa đi qua không hề vô nghĩa!<br>
                            🎁 Phần thưởng an ủi cho nỗ lực hôm nay: <b style="color:#f1c40f;">+${expAnUi} EXP & +${diemAnUi} Điểm</b>.<br>
                            Hãy nghỉ ngơi rồi quay lại — ngọn núi vẫn luôn chờ em chinh phục! 🌟
                        `;
                    } else {
                        theMoTa.innerText = `Đỉnh núi vẫn còn cách ${Math.round(bossHP)} bước, bạn còn ${Math.round(playerHP)}% sức bền. Hãy rèn luyện thêm nhé, đừng nản lòng nhé! 🌟`;
                    }
                }
            }
        }

        // ============================================================
        //  KHỞI TẠO
        // ============================================================
        window.addEventListener('DOMContentLoaded', async () => {
            let tenSomKiemTra = layTenHocSinhHienTai();
            await Promise.all([
                window.__fbTaiCauHinhToanCuc(),
                tenSomKiemTra ? window.__fbTaiDuLieuTuMay(tenSomKiemTra) : Promise.resolve()
            ]);

            let coLuot = kiemTraVaHienThiLuotBoss();
            if (coLuot) {
                phatAmThanhHanhDong('danger_alarm');

                let ten = layTenHocSinhHienTai();
                if (ten) {
                    docNganHangDeBoss();
                } else {
                    document.querySelector('.boss-card').insertAdjacentHTML('afterend', `
                        <div style="background:#1a2236; padding:16px; border-radius:12px; margin-top:12px; text-align:center; border:1px solid #3498db;">
                            <p style="color:#f1c40f; font-weight:bold; font-size:0.95rem;"><i class="fa-solid fa-circle-exclamation"></i> Nhập tên để bắt đầu!</p>
                            <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:6px;">
                                <input type="text" id="quick-name-input" placeholder="Họ và tên" style="padding:10px; border-radius:8px; background:#0b111e; border:1px solid #233354; color:white; font-size:0.95rem; flex:1; min-width:160px;">
                                <button onclick="dangNhapNhanh()" style="background:#3498db; color:white; border:none; padding:10px 18px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:0.95rem;">Vào trận</button>
                            </div>
                        </div>
                    `);
                }
            }
        });

        async function dangNhapNhanh() {
            let input = document.getElementById('quick-name-input');
            if (!input) return;
            let name = input.value.trim();
            if (!name) return alert('Vui lòng nhập tên!');
            sessionStorage.setItem('hoc_school_student_name', name);
            sessionStorage.setItem('hoc_school_student_class', 'Khối 7');
            await window.__fbTaiDuLieuTuMay(name);
            let quick = document.querySelector('.boss-card + div');
            if (quick) quick.remove();
            docNganHangDeBoss();
        }

        function kiemTraVaHienThiLuotBoss() {
            let duLieu = layDuLieuLuotBoss();
            let soLuotToiDa = laySoLuotBossToiDa();

            let thongBaoEl = document.getElementById('boss-luot-status');
            if (!thongBaoEl) {
                thongBaoEl = document.createElement('div');
                thongBaoEl.id = 'boss-luot-status';
                thongBaoEl.style.cssText = 'margin-top: 12px; padding: 12px 16px; border-radius: 8px; border: 1px solid; font-size: 0.9rem; font-weight: 500; text-align: center;';
                document.querySelector('.boss-card').after(thongBaoEl);
            }

            if (!duLieu) {
                thongBaoEl.style.background = 'rgba(231,76,60,0.12)';
                thongBaoEl.style.borderColor = '#e74c3c';
                thongBaoEl.style.color = '#e74c3c';
                thongBaoEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Chưa xác định danh tính. Vui lòng đăng nhập.`;
                return false;
            }

            thongBaoEl.style.display = 'block';

            if (duLieu.soLuotConLai <= 0) {
                thongBaoEl.style.background = 'rgba(231,76,60,0.12)';
                thongBaoEl.style.borderColor = '#e74c3c';
                thongBaoEl.style.color = '#e74c3c';
                thongBaoEl.innerHTML = `<i class="fa-solid fa-lock"></i> Em đã dùng hết <b>${soLuotToiDa} lượt</b> Thử Thách Tối Thượng tuần này! Hẹn gặp lại em tuần sau nhé, cố lên! 💪`;
                return false;
            }

            thongBaoEl.style.background = 'rgba(231,76,60,0.10)';
            thongBaoEl.style.borderColor = '#e74c3c';
            thongBaoEl.style.color = '#f1c40f';
            thongBaoEl.innerHTML = `<i class="fa-solid fa-mountain"></i> Em còn <b>${duLieu.soLuotConLai}</b> lượt Thử Thách Tối Thượng tuần này. Cố lên, em làm được! 🌟`;
            return true;
        }
    </script>
</body>
</html>
