<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VÒNG QUAY ĐỊNH MỆNH - HERO MATH</title>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@700&family=Cinzel+Decorative:wght@700;900&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }
        
        body { 
            background-color: #050811;
            background: radial-gradient(circle at center, #0d1527 0%, #050811 100%);
            color: #fff; 
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 10px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            background: linear-gradient(135deg, #0f172a 0%, #070d19 100%); 
            border: 2px solid #560707; 
            padding: 25px 20px; 
            border-radius: 20px; 
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(139, 0, 0, 0.5); 
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            animation: pulseBorder 4s infinite alternate;
        }

        @keyframes pulseBorder {
            0% { border-color: #560707; box-shadow: 0 0 25px rgba(0,0,0,0.8), 0 0 12px rgba(139, 0, 0, 0.4); }
            100% { border-color: #a91b1b; box-shadow: 0 0 35px rgba(0,0,0,0.9), 0 0 25px rgba(169, 27, 27, 0.7); }
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.7), 0 0 25px rgba(231, 76, 60, 0.6);
            font-size: 1.6rem;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #718096;
            margin-bottom: 15px;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        #luot-quay-info {
            background: rgba(5, 8, 17, 0.8);
            border: 1px double #8b0000;
            border-radius: 10px;
            padding: 10px 15px;
            margin: 10px auto;
            font-size: 0.95rem;
            min-height: 24px;
            color: #a0aec0;
            font-family: 'Averia Serif Libre', serif;
            box-shadow: inset 0 0 10px rgba(139, 0, 0, 0.3);
        }
        #luot-quay-info b { color: #2ecc71; text-shadow: 0 0 5px rgba(46, 204, 113, 0.3); }

        #wheel-wrapper { 
            position: relative; 
            width: 290px; 
            height: 290px; 
            margin: 25px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(145deg, #f1c40f, #8b0000);
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.3), 0 0 50px rgba(139, 0, 0, 0.5);
        }
        
        #wheel { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 6px solid #070d19;
            box-sizing: border-box;
            background: conic-gradient(
                #2c0735 0deg 45deg,
                #5c0a0a 45deg 90deg,
                #1c2541 90deg 135deg,
                #3d0c1f 135deg 180deg,
                #2c0735 180deg 225deg,
                #5c0a0a 225deg 270deg,
                #1c2541 270deg 315deg,
                #3d0c1f 315deg 360deg
            );
            transition: transform 4s cubic-bezier(0.15, 0.75, 0.15, 1);
            position: relative;
        }

        #wheel::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            border-radius: 50%;
            background: 
                linear-gradient(90deg, transparent 50%, rgba(241,196,15,0.15) 50%),
                linear-gradient(0deg, transparent 50%, rgba(241,196,15,0.15) 50%);
            pointer-events: none;
        }

        .num { 
            position: absolute;
            width: 100%; 
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 22px;
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            font-size: 1rem;
            color: #ffffff; 
            text-shadow: 0 0 6px #f1c40f, 1px 1px 4px rgba(0, 0, 0, 1);
            pointer-events: none;
            box-sizing: border-box;
            transform-origin: center center;
        }
        
        .pointer { 
            position: absolute; 
            top: -22px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 16px solid transparent; 
            border-right: 16px solid transparent; 
            border-top: 32px solid #f1c40f; 
            filter: drop-shadow(0px 4px 10px rgba(231, 76, 60, 0.9));
            z-index: 10; 
        }
        .pointer::after {
            content: '';
            position: absolute;
            top: -30px; left: -6px;
            width: 12px; height: 12px;
            background: #cbd5e1;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff;
        }
        
        .btn-quay { 
            width: 100%;
            padding: 15px 0; 
            font-size: 1.2rem; 
            background: linear-gradient(90deg, #8b0000, #b22222); 
            border: 1px solid #ff4d4d; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 900;
            font-family: 'Cinzel Decorative', serif;
            letter-spacing: 2px;
            color: #fff;
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.6);
            transition: all 0.3s;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .btn-quay:hover:not(:disabled) {
            transform: translateY(-2px);
            background: linear-gradient(90deg, #a90000, #cc2424);
            box-shadow: 0 6px 25px rgba(204, 36, 36, 0.8);
        }
        .btn-quay:disabled {
            background: #2c3344;
            color: #6b7588;
            border-color: #1e293b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #msg { 
            margin-top: 20px; 
            font-size: 1.15rem; 
            color: #f1c40f; 
            font-family: 'Averia Serif Libre', serif;
            font-weight: bold;
            min-height: 45px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.6);
            line-height: 1.4;
            padding: 0 10px;
        }

        .back-link { 
            display: inline-block; 
            margin-top: 15px; 
            width: 100%;
            color: #718096; 
            text-decoration: none; 
            border: 1px solid #1e293b; 
            padding: 12px 0; 
            border-radius: 10px; 
            transition: all 0.3s;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .back-link:hover {
            background-color: #1e293b;
            border-color: #334155;
            color: #cbd5e1;
        }

        @media (max-width: 375px) {
            .game-container { padding: 20px 15px; }
            h1 { font-size: 1.35rem; }
            #wheel-wrapper { width: 240px; height: 240px; margin: 15px auto; }
            .num { font-size: 0.85rem; padding-top: 16px; }
            #msg { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <audio id="bg-fairy-music" src="thugian.mp3" loop autoplay></audio>

    <div class="game-container">
        <h1>🔮 VÒNG QUAY ĐỊNH MỆNH 🔮</h1>
        <div class="subtitle">Thử thách nhân phẩm - Kích hoạt đại pháp trận</div>
        
        <div id="luot-quay-info">Đang liên kết ma pháp trận...</div>
        
        <div id="wheel-wrapper">
            <div class="pointer"></div>
            <div id="wheel">
                <div class="num" style="transform: rotate(22.5deg);">100XP</div>
                <div class="num" style="transform: rotate(67.5deg);">20XP</div>
                <div class="num" style="transform: rotate(112.5deg);">50XP</div>
                <div class="num" style="transform: rotate(157.5deg);">10XP</div>
                <div class="num" style="transform: rotate(202.5deg);">20XP</div>
                <div class="num" style="transform: rotate(247.5deg);">30XP</div>
                <div class="num" style="transform: rotate(292.5deg);">50XP</div>
                <div class="num" style="transform: rotate(337.5deg);">10XP</div>
            </div>
        </div>

        <button class="btn-quay" id="btn" onclick="quay()">QUAY NGAY <i class="fa-solid fa-dice-d20"></i></button>
        <div id="msg"></div>
        
        <a href="index.html" class="back-link"><i class="fa-solid fa-door-open"></i> Trở Về Sảnh Chính</a>
    </div>

    <script type="module">
        import { db, taiDuLieuTuMay, dayDuLieuLenMay } from "./firebase-sync.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        window.__fbTaiDuLieuTuMay = taiDuLieuTuMay;
        window.__fbDayDuLieuLenMay = dayDuLieuLenMay;

        window.__fbDaNopTuLuanHomNay = async function (tenHocSinh) {
            try {
                const homNay = new Date().toLocaleDateString('vi-VN');
                const snap = await getDocs(collection(db, "bai_tap_tu_luan"));
                let daNop = false;
                snap.forEach(d => {
                    const data = d.data();
                    if (data.hocSinh === tenHocSinh && data.thoiGianNop) {
                        let ngayNop = new Date(data.thoiGianNop).toLocaleDateString('vi-VN');
                        if (ngayNop === homNay) daNop = true;
                    }
                });
                return daNop;
            } catch (loi) {
                console.error("[Vong Quay] Lỗi kiểm tra bài Tự Luận:", loi);
                return false;
            }
        };
    </script>
    <script>
        // Tự động kích hoạt nhạc nền
        const amThanhNenMedia = document.getElementById('bg-fairy-music');
        window.addEventListener('DOMContentLoaded', () => {
            let playPromise = amThanhNenMedia.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    document.body.addEventListener('click', () => {
                        amThanhNenMedia.play().catch(()=>{});
                    }, { once: true });
                });
            }
        });

        // Âm thanh tick
        function playTickSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator(); let gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.05);
            } catch (e) {}
        }

        function playWinSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let now = ctx.currentTime;
                let osc1 = ctx.createOscillator(); let gain1 = ctx.createGain();
                osc1.type = 'triangle'; osc1.frequency.setValueAtTime(523.25, now);
                gain1.gain.setValueAtTime(0.1, now); gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc1.connect(gain1); gain1.connect(ctx.destination);
                osc1.start(); osc1.stop(now + 0.3);
                let osc2 = ctx.createOscillator(); let gain2 = ctx.createGain();
                osc2.type = 'triangle'; osc2.frequency.setValueAtTime(659.25, now + 0.15);
                gain2.gain.setValueAtTime(0.1, now + 0.15); gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc2.connect(gain2); gain2.connect(ctx.destination);
                osc2.start(); osc2.stop(now + 0.5);
            } catch (e) {}
        }

        // ------------------- HỆ THỐNG LƯỢT QUAY -------------------
        function layTenHocSinh() {
            let ten = sessionStorage.getItem('hoc_school_student_name');
            if (ten) return ten;
            let nhatKy = JSON.parse(localStorage.getItem('nhat_ky_dang_nhap')) || [];
            if (nhatKy.length > 0) {
                let last = nhatKy[nhatKy.length - 1];
                ten = last.name;
                sessionStorage.setItem('hoc_school_student_name', ten);
                sessionStorage.setItem('hoc_school_student_class', last.className || 'Khối 7');
                return ten;
            }
            return null;
        }

        function laySoLuotToiDa() {
            return parseInt(localStorage.getItem('so_luot_vong_quay_toi_da')) || 1;
        }

        // ------------------- ĐIỀU KIỆN: HOÀN THÀNH 3 NHIỆM VỤ -------------------
        async function layTienDoNhiemVu(ten) {
            let homNay = new Date().toLocaleDateString('vi-VN');

            let soLuotLamBaiMax = parseInt(localStorage.getItem('so_luot_lam_bai_toi_da')) || 3;
            let rawLB = JSON.parse(localStorage.getItem('luot_lam_bai_' + ten)) || null;
            let luotLamBai = (rawLB && rawLB.date === homNay) ? rawLB.soLuotConLai : soLuotLamBaiMax;

            let soLuotVuotAiMax = parseInt(localStorage.getItem('so_luot_vuot_ai_toi_da')) || 3;
            let rawVA = JSON.parse(localStorage.getItem('luot_vuot_ai_' + ten)) || null;
            let luotVuotAi = (rawVA && rawVA.date === homNay) ? rawVA.soLuotConLai : soLuotVuotAiMax;

            let daNopTuLuan = await window.__fbDaNopTuLuanHomNay(ten);

            return {
                luotLamBai, luotVuotAi, daNopTuLuan,
                daXongHet: luotLamBai <= 0 && luotVuotAi <= 0 && daNopTuLuan === true
            };
        }

        function layKeyLuot(ten) {
            return 'luot_vong_quay_' + ten;
        }

        function layDuLieuLuot(ten) {
            let key = layKeyLuot(ten);
            let raw = JSON.parse(localStorage.getItem(key)) || null;
            let homNay = new Date().toLocaleDateString('vi-VN');
            let soLuotMax = laySoLuotToiDa();
            if (!raw || raw.date !== homNay) {
                raw = { date: homNay, soLuotConLai: soLuotMax };
                localStorage.setItem(key, JSON.stringify(raw));
            }
            return raw;
        }

        async function capNhatGiaoDien() {
            let ten = layTenHocSinh();
            let infoEl = document.getElementById('luot-quay-info');
            let btn = document.getElementById('btn');

            if (!ten) {
                infoEl.style.color = '#e74c3c';
                infoEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Chưa xác định danh tính. Vui lòng về Sảnh Đăng nhập.';
                btn.disabled = true;
                return;
            }

            await window.__fbTaiDuLieuTuMay(ten);

            let tienDo = await layTienDoNhiemVu(ten);
            if (!tienDo.daXongHet) {
                let conLai = [];
                if (tienDo.luotLamBai > 0) conLai.push('Nhiệm Vụ Hôm Nay (' + tienDo.luotLamBai + ' lượt)');
                if (tienDo.luotVuotAi > 0) conLai.push('Nâng Cấp Tư Duy (' + tienDo.luotVuotAi + ' lượt)');
                if (!tienDo.daNopTuLuan) conLai.push('Thử Thách Tự Luận (chưa nộp ảnh hôm nay)');
                infoEl.style.color = '#e74c3c';
                infoEl.innerHTML = '<i class="fa-solid fa-lock"></i> Hãy hoàn thành hết: <b>' + conLai.join(', ') + '</b> trước khi được quay!';
                btn.disabled = true;
                btn.innerHTML = 'CHƯA ĐỦ ĐIỀU KIỆN <i class="fa-solid fa-lock"></i>';
                return;
            }

            let duLieu = layDuLieuLuot(ten);
            let soLuotMax = laySoLuotToiDa();

            if (duLieu.soLuotConLai <= 0) {
                infoEl.style.color = '#e74c3c';
                infoEl.innerHTML = 'Hao hụt ma lực! Đã dùng hết <b>' + soLuotMax + ' lượt</b> hôm nay. Hãy quay lại vào ngày mai!';
                btn.disabled = true;
                btn.innerHTML = 'HẾT LƯỢT HÔM NAY';
            } else {
                infoEl.style.color = '#f1c40f';
                infoEl.innerHTML = 'Chiến binh còn <b>' + duLieu.soLuotConLai + '</b> lượt ban phước hôm nay.';
                btn.disabled = false;
                btn.innerHTML = 'QUAY NGAY <i class="fa-solid fa-dice-d20"></i>';
            }
        }

        // SỬA LỖI: Lấy góc quay hiện tại từ transform (hỗ trợ matrix và matrix3d)
        function getCurrentAngle(element) {
            const style = window.getComputedStyle(element);
            const transform = style.transform;
            if (transform === 'none') return 0;

            // Hỗ trợ matrix3d
            let matrix = transform.match(/matrix3d\(([^)]+)\)/);
            if (matrix) {
                const values = matrix[1].split(',').map(Number);
                // matrix3d: các phần tử [0,1,4,5] tương ứng với scale và translation
                // Góc quay từ ma trận 3D: atan2(b, a) với a=values[0], b=values[1]
                const angle = Math.atan2(values[1], values[0]) * (180 / Math.PI);
                return ((angle % 360) + 360) % 360;
            }

            // Hỗ trợ matrix (2D)
            matrix = transform.match(/matrix\(([^)]+)\)/);
            if (matrix) {
                const values = matrix[1].split(',').map(Number);
                const angle = Math.atan2(values[1], values[0]) * (180 / Math.PI);
                return ((angle % 360) + 360) % 360;
            }

            return 0;
        }

        // ---------- QUAY (SỬA LỖI ASYNC) ----------
        async function quay() {
            let ten = layTenHocSinh();
            if (!ten) { alert("Chưa xác định được danh tính! Vui lòng đăng nhập từ Sảnh Chính."); return; }

            // Gọi await để lấy kết quả đúng
            let tienDo = await layTienDoNhiemVu(ten);
            if (!tienDo.daXongHet) { capNhatGiaoDien(); return; }

            let duLieu = layDuLieuLuot(ten);
            if (duLieu.soLuotConLai <= 0) { capNhatGiaoDien(); return; }

            const wheel = document.getElementById('wheel');
            const btn = document.getElementById('btn');
            btn.disabled = true;
            document.getElementById('msg').innerHTML = "<i class='fa-solid fa-gandalf-hat class-spin'></i> Đại pháp trận đang xoay chuyển...";

            const vals = [100, 20, 50, 10, 20, 30, 50, 10];
            const randomIndex = Math.floor(Math.random() * 8);
            const diemTrungThuong = vals[randomIndex];

            // Góc dừng: 337.5 - randomIndex * 45 (đã tính toán để mũi tên chỉ đúng ô)
            const stopDeg = 337.5 - randomIndex * 45;
            let currentAngle = getCurrentAngle(wheel);
            let delta = (stopDeg - currentAngle + 360) % 360;
            // Xoay ít nhất 5 vòng để đẹp
            delta += 5 * 360;

            const newAngle = currentAngle + delta;
            wheel.style.transition = 'transform 4s cubic-bezier(0.15, 0.75, 0.15, 1)';
            wheel.style.transform = 'rotate(' + newAngle + 'deg)';

            // Hiệu ứng âm thanh tick
            let totalTicks = 25;
            for (let i = 0; i < totalTicks; i++) {
                let delay = 4000 * Math.pow(i / totalTicks, 1.8);
                setTimeout(playTickSound, delay);
            }

            setTimeout(function() {
                playWinSound();

                // Cộng thưởng
                let expHienTai = parseInt(localStorage.getItem('exp_' + ten)) || 0;
                localStorage.setItem('exp_' + ten, expHienTai + diemTrungThuong);

                let coinHienTai = parseInt(localStorage.getItem('coin_' + ten)) || 50;
                localStorage.setItem('coin_' + ten, coinHienTai + diemTrungThuong);

                // Giảm lượt quay
                duLieu.soLuotConLai = Math.max(0, duLieu.soLuotConLai - 1);
                localStorage.setItem(layKeyLuot(ten), JSON.stringify(duLieu));

                window.__fbDayDuLieuLenMay(ten);

                document.getElementById('msg').innerHTML = '🎉 Chúc mừng Dũng Sĩ! Khai quang trúng thần khí:<br><span style="color:#2ecc71">+' + diemTrungThuong + ' XP</span> & <span style="color:#e74c3c">+' + diemTrungThuong + ' Điểm thưởng</span>';
                capNhatGiaoDien();
            }, 4000);
        }

        window.addEventListener('DOMContentLoaded', capNhatGiaoDien);
        window.addEventListener('pageshow', capNhatGiaoDien);
    </script>
</body>
</html>
